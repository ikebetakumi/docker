zend_extension=xdebug

; デフォルトは off。develop/debug のまま常時有効だと、IDE 側のデバッガが
; 待ち受けていない時に毎リクエストが接続待ちで数秒〜数十秒詰まることがある。
; 使うときだけ下の行を "xdebug.mode=debug,develop" に変更して
; `docker-compose restart app`（お手軽なステップ実行が要らない時は必ず off に戻す）
xdebug.mode=off

xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.start_with_request=yes
xdebug.idekey=VSCODE
